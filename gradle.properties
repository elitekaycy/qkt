# Keep the Gradle, Kotlin, and forked-test processes viable together on a 4 GB host.
# The test source set still needs more than Gradle's ~512 MB default during IR lowering.
org.gradle.jvmargs=-Xmx1500m -XX:MaxMetaspaceSize=512m -Dfile.encoding=UTF-8
kotlin.daemon.jvmargs=-Xmx1g -Dfile.encoding=UTF-8
