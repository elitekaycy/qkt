[[case.check]]
kind = "bars_equal"
symbol = "YAHOO:AAPL"
reader = "yfinance_bars"
file = "yfinance/AAPL-1m.csv"

[[case]]
id = "drift-yfinance-two-tickers"
[[case.step]]
run = ["data", "import", "{corpus}/yfinance/AAPL-MSFT-1d-multi.csv", "--as", "YAHOO:MSFT", "--data-root", "{root}"]
