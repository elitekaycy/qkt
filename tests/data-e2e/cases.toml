# ------------------------------------------------------------------------------------- the store and CLI

[[case]]
id = "data-root-precedence"
tier = "pr"
golden = false
[[case.step]]
# data_root in the project's config, relative to the config file, found from the project folder.
files = { "{work}/proj/qkt.config.yaml" = "data_root: ./data\n" }
cwd = "{work}/proj"
run = ["data", "import", "{corpus}/binance/futures-um/BTCUSDT-1h-2026-10-14.zip", "--as", "BINANCE_UM:BTCUSDT"]
contains = ["qkt: data root {work}/proj/data (from data_root in {work}/proj/qkt.config.yaml)"]
[[case.step]]
# QKT_DATA_HOME beats the config.
cwd = "{work}/proj"
env = { QKT_DATA_HOME = "{work}/env-root" }
run = ["data", "import", "{corpus}/binance/futures-um/BTCUSDT-1h-2026-10-14.zip", "--as", "BINANCE_UM:BTCUSDT"]
contains = ["qkt: data root {work}/env-root (from QKT_DATA_HOME)"]
[[case.step]]
# --data-root beats both, and is not announced (the user typed it).
cwd = "{work}/proj"
env = { QKT_DATA_HOME = "{work}/env-root" }
run = ["data", "import", "{corpus}/binance/futures-um/BTCUSDT-1h-2026-10-14.zip", "--as", "BINANCE_UM:BTCUSDT", "--data-root", "{work}/flag-root"]
lacks = ["qkt: data root"]
[[case.step]]
# --config names the project from anywhere.
run = ["data", "verify", "BINANCE_UM:BTCUSDT", "--config", "{work}/proj/qkt.config.yaml"]
contains = ["qkt: data root {work}/proj/data (from data_root in {work}/proj/qkt.config.yaml)", "1h", "ok"]
[[case.step]]
# An absolute data_root that does not exist (a container path read on the host) is refused, never swapped.
files = { "{work}/host/qkt.config.yaml" = "data_root: /qkt-e2e-no-such-dir/data\n" }
cwd = "{work}/host"
run = ["data", "verify", "BINANCE_UM:BTCUSDT"]
exit = 2
contains = ["is /qkt-e2e-no-such-dir/data, which does not exist here"]
[[case.step]]
# No flag, variable or config: the default under the user's home.
run = ["data", "import", "{corpus}/binance/futures-um/BTCUSDT-1h-2026-10-14.zip", "--as", "BINANCE_UM:BTCUSDT"]
contains = ["qkt: data root {work}/home/.qkt/data (default; move it with --data-root or QKT_DATA_HOME)"]
[[case.check]]
kind = "exists"
paths = ["{work}/proj/data/bars/BINANCE_UM/BTCUSDT/1h/2026-10-14.csv", "{work}/env-root/bars/BINANCE_UM/BTCUSDT/1h/2026-10-14.csv", "{work}/flag-root/bars/BINANCE_UM/BTCUSDT/1h/2026-10-14.csv", "{work}/home/.qkt/data/bars/BINANCE_UM/BTCUSDT/1h/2026-10-14.csv"]

[[case]]
id = "verify-bars-finds-damage"
tier = "pr"
golden = false
[[case.step]]
run = ["data", "import", "{corpus}/histdata/EURUSD-ASCII-M1-2026-03.zip", "--as", "HISTDATA:EURUSD", "--data-root", "{root}"]
[[case.step]]
run = ["data", "verify", "HISTDATA:EURUSD", "--data-root", "{root}"]
contains = ["0 flagged"]
[[case.step]]
remove = ["{root}/bars/HISTDATA/EURUSD/1m/2026-03-11.csv"]
append = { "{root}/bars/HISTDATA/EURUSD/1m/2026-03-12.csv" = "1772000000000,1.1,1.2,1.0,1.1,0\n" }
[[case.step]]
run = ["data", "verify", "HISTDATA:EURUSD", "--data-root", "{root}"]
exit = 1
contains = ["2026-03-11  MISSING", "2026-03-12  unreadable:"]

[[case]]
id = "build-bars-rebuilds-a-changed-day"
tier = "pr"
[[case.step]]
run = ["data", "import", "{corpus}/binance/spot/ADAUSDT-trades-2026-10-14.zip", "--as", "ADAUSDT", "--data-root", "{root}"]
[[case.step]]
run = ["data", "build-bars", "ADAUSDT", "--tf", "1m", "--data-root", "{root}"]
contains = ["built=1 skipped=0 bars=1440"]
[[case.step]]
run = ["data", "build-bars", "ADAUSDT", "--tf", "1m", "--data-root", "{root}"]
contains = ["built=0 skipped=1 bars=0"]
[[case.step]]
# The day replaced by another venue's trades: its built bars must follow, not stay Binance's.
run = ["data", "import", "{corpus}/bybit/ADAUSDT_2026-10-14.csv.gz", "--as", "ADAUSDT", "--on-overlap", "replace", "--data-root", "{root}"]
contains = ["1 replaced"]
[[case.step]]
run = ["data", "build-bars", "ADAUSDT", "--tf", "1m", "--data-root", "{root}"]
contains = ["built=1 skipped=0"]
[[case.check]]
kind = "built_bars"
symbol = "ADAUSDT"
reader = "bybit_trades"
file = "bybit/ADAUSDT_2026-10-14.csv.gz"
use = "price"
from = "2026-10-14"
to = "2026-10-14"
tfs = ["1m", "1h"]

[[case]]
id = "convert-and-prune-read-back-identically"
tier = "pr"
[[case.step]]
run = ["data", "import", "{corpus}/binance/spot/ADAUSDT-trades-2026-10-14.zip", "--as", "ADAUSDT", "--data-root", "{root}"]
[[case.step]]
run = ["data", "bars", "ADAUSDT", "--tf", "1m", "--from", "2026-10-14", "--to", "2026-10-14", "--data-root", "{root}"]
stdout_to = "{work}/from-csv.csv"
[[case.step]]
run = ["data", "convert", "ADAUSDT", "--data-root", "{root}"]
contains = ["converted=1 skipped=0 prune=false"]
[[case.step]]
run = ["data", "bars", "ADAUSDT", "--tf", "1m", "--from", "2026-10-14", "--to", "2026-10-14", "--data-root", "{root}"]
stdout_to = "{work}/from-bin.csv"
[[case.step]]
run = ["data", "convert", "ADAUSDT", "--prune", "--data-root", "{root}"]
contains = ["converted=0 skipped=1 prune=true pruned=1"]
[[case.step]]
run = ["data", "bars", "ADAUSDT", "--tf", "1m", "--from", "2026-10-14", "--to", "2026-10-14", "--data-root", "{root}"]
stdout_to = "{work}/pruned.csv"
[[case.check]]
kind = "files_equal"
pairs = [["{work}/from-csv.csv", "{work}/from-bin.csv"], ["{work}/from-csv.csv", "{work}/pruned.csv"]]
[[case.check]]
kind = "exists"
paths = ["{root}/symbols/ADAUSDT/2026-10-14.bin"]
absent = ["{root}/symbols/ADAUSDT/2026-10-14.csv.gz"]

[[case]]
id = "snapshot-pins-an-imported-fx-store"
golden = false
[[case.step]]
run = ["data", "import", "{corpus}/histdata/EURUSD-ASCII-T-2026-03.zip", "--as", "EURUSD", "--data-root", "{root}"]
[[case.step]]
run = ["data", "snapshot", "EURUSD", "--from", "2026-03-01", "--to", "2026-04-01", "--out", "{work}/snap.json", "--data-root", "{root}"]
contains = ["files=27"]
[[case.step]]
run = ["data", "verify", "EURUSD", "--snapshot", "{work}/snap.json", "--data-root", "{root}"]
contains = ["ok (27 files)"]
[[case.step]]
files = { "{work}/hourly.qkt" = "STRATEGY hourly_cross VERSION 1\n\nSYMBOLS\n    fx = BACKTEST:EURUSD EVERY 1h\n\nRULES\n    WHEN ema(fx.close, 5) CROSSES ABOVE ema(fx.close, 20) AND POSITION.fx = 0\n    THEN BUY fx SIZING 0.1\n    WHEN ema(fx.close, 5) CROSSES BELOW ema(fx.close, 20) AND POSITION.fx > 0\n    THEN CLOSE fx\n" }
run = ["backtest", "{work}/hourly.qkt", "--from", "2026-03-02", "--to", "2026-03-31", "--data-root", "{root}", "--no-fetch", "--dataset", "{work}/snap.json", "--report-dir", "{work}/run1"]
[[case.step]]
run = ["backtest", "{work}/hourly.qkt", "--from", "2026-03-02", "--to", "2026-03-31", "--data-root", "{root}", "--no-fetch", "--dataset", "{work}/snap.json", "--report-dir", "{work}/run2"]
[[case.step]]
# A file appearing on a pinned-absent Saturday is a change.
files = { "{root}/symbols/EURUSD/2026-03-07.csv" = "timestamp,symbol,price,volume,bid,ask,bidVolume,askVolume\n" }
run = ["data", "verify", "EURUSD", "--snapshot", "{work}/snap.json", "--data-root", "{root}"]
exit = 1
contains = ["2026-03-07: a day file appeared"]
[[case.step]]
remove = ["{root}/symbols/EURUSD/2026-03-07.csv"]
append = { "{root}/symbols/EURUSD/2026-03-10.csv.gz" = "x" }
run = ["backtest", "{work}/hourly.qkt", "--from", "2026-03-02", "--to", "2026-03-31", "--data-root", "{root}", "--no-fetch", "--dataset", "{work}/snap.json", "--report-dir", "{work}/run3"]
exit = 1
contains = ["dataset snapshot verification failed", "2026-03-10: size changed"]
[[case.check]]
kind = "files_equal"
pairs = [["{work}/run1/trades.csv", "{work}/run2/trades.csv"], ["{work}/run1/orders.jsonl", "{work}/run2/orders.jsonl"], ["{work}/run1/equity_daily.csv", "{work}/run2/equity_daily.csv"], ["{work}/run1/equity_global.csv", "{work}/run2/equity_global.csv"], ["{work}/run1/monthly_returns.csv", "{work}/run2/monthly_returns.csv"]]

# -------------------------------------------------------------------------------------------- Dukascopy
# A datafeed day as Dukascopy serves it: 24 hour files of ticks and its own BID/ASK minute candles beside them
# (folder months count from 00, so 2026/08/15 is 2026-09-15).

[[case]]
id = "dukascopy-bi5-day-eurusd"
tier = "pr"
[[case.step]]
run = ["data", "import", "{corpus}/dukascopy/EURUSD", "--as", "EURUSD", "--data-root", "{root}"]
contains = ["Format   dukascopy-bi5 (matched)", "49858 ticks records", "skipped"]
again_noop = true
[[case.check]]
kind = "ticks_equal"
symbol = "EURUSD"
reader = "dukascopy_bi5_day"
divisor = 100000
file = "dukascopy/EURUSD/2026/08/15"
[[case.check]]
kind = "built_bars"
symbol = "EURUSD"
reader = "dukascopy_bi5_day"
divisor = 100000
file = "dukascopy/EURUSD/2026/08/15"
vendor_reader = "dukascopy_candles"
vendors = [{ vendor = "dukascopy/EURUSD/2026/08/15/BID_candles_min_1.bi5", use = "bid" }, { vendor = "dukascopy/EURUSD/2026/08/15/ASK_candles_min_1.bi5", use = "ask" }]
vendor_flat_ok = true
use = "mid"
from = "2026-09-15"
to = "2026-09-15"
tfs = ["1m", "5m", "1h", "1d"]
fields = ["open", "high", "low", "close"]

[[case]]
id = "dukascopy-bi5-day-usdjpy"
[[case.step]]
run = ["data", "import", "{corpus}/dukascopy/USDJPY", "--as", "USDJPY", "--data-root", "{root}"]
contains = ["Format   dukascopy-bi5 (matched)"]
[[case.check]]
kind = "ticks_equal"
symbol = "USDJPY"
reader = "dukascopy_bi5_day"
divisor = 1000
file = "dukascopy/USDJPY/2026/08/15"
[[case.check]]
kind = "built_bars"
symbol = "USDJPY"
reader = "dukascopy_bi5_day"
divisor = 1000
file = "dukascopy/USDJPY/2026/08/15"
vendor_reader = "dukascopy_candles"
vendors = [{ vendor = "dukascopy/USDJPY/2026/08/15/BID_candles_min_1.bi5", use = "bid" }, { vendor = "dukascopy/USDJPY/2026/08/15/ASK_candles_min_1.bi5", use = "ask" }]
vendor_flat_ok = true
use = "mid"
from = "2026-09-15"
to = "2026-09-15"
tfs = ["1m", "1h"]
fields = ["open", "high", "low", "close"]

[[case]]
id = "dukascopy-candle-file-named-refused"
tier = "pr"
[[case.step]]
run = ["data", "import", "{corpus}/dukascopy/EURUSD/2026/08/15/BID_candles_min_1.bi5", "--as", "EURUSD", "--data-root", "{root}"]
exit = 1
contains = ["is a Dukascopy candle file, which qkt does not read"]
writes_nothing = true
