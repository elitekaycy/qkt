# Real-data end-to-end cases. Paths are relative to the corpus unless they start with {root} (this case's
# data root), {work} (its scratch folder) or {samples} (qkt's in-repo import samples). `tier = "pr"` cases run
# on every pull request; every case runs on the testing branch. See docs/superpowers/specs/2026-10-18-data-e2e-suite-design.md.

# ---------------------------------------------------------------------------------------------- Binance

[[case]]
id = "binance-spot-trades-ada"
tier = "pr"
[[case.step]]
run = ["data", "import", "{corpus}/binance/spot/ADAUSDT-trades-2026-10-14.zip", "--as", "ADAUSDT", "--data-root", "{root}"]
contains = ["Format   binance-trades (matched)", "120132 rows → 120132 ticks records", "Days     1  2026-10-14"]
again_noop = true
[[case.check]]
kind = "ticks_equal"
symbol = "ADAUSDT"
reader = "binance_trades"
file = "binance/spot/ADAUSDT-trades-2026-10-14.zip"
[[case.check]]
kind = "vendor_bars"
symbol = "ADAUSDT"
from = "2026-10-14"
to = "2026-10-14"
tfs = ["1m", "5m", "1h", "4h", "1d"]
vendor = "binance/spot/ADAUSDT-{tf}-2026-10-14.zip"
reader = "binance_klines"
paths = ["read", "built"]

