id: "dukascopy-node-ticks"
description: "dukascopy-node CSV ticks (epoch milliseconds, UTC)"
kind: "ticks"
time: ["timestamp"]
timeFormat: "epoch"
fields:
  bid: "bidPrice"
  ask: "askPrice"
  bidVolume: "bidVolume?"
  askVolume: "askVolume?"
  volume: "bidVolume + askVolume?"
volume: "bid plus ask quoted size, summed exactly as qkt's Dukascopy fetcher does"
match:
  header: ["timestamp", "askPrice", "bidPrice"]
