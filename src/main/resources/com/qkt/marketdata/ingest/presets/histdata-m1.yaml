id: "histdata-m1"
description: "HistData.com generic ASCII M1 bars (DAT_ASCII_*_M1_*): New York time until 2018-12-16, London minus 5h since, bid prices"
kind: "bars"
delimiter: ";"
time: ["$0"]
timeFormat: "yyyyMMdd HHmmss"
# Measured 2026-10-20 against Dukascopy UTC data, 2016 to 2026 (HistData's FAQ says EST without DST, which fits no
# summer): New York wall time until HistData's feed changed at the weekly open of 2018-12-16, London minus 5h since.
clock: "America/New_York until 2018-12-16T17:00, then Europe/London-5h"
basis: "bid"
timeframe: "1m"
fields:
  open: "$1"
  high: "$2"
  low: "$3"
  close: "$4"
volume: "none (HistData publishes 0)"
match:
  columns: 6
  firstCell: "\\d{8} \\d{6}"
  filename: "DAT_ASCII_.*_M1_"
  delimiter: ";"
