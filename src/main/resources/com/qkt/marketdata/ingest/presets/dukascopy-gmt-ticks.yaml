id: "dukascopy-gmt-ticks"
description: "Dukascopy website / JForex tick export in GMT"
kind: "ticks"
time: ["Gmt time"]
timeFormat: "dd.MM.yyyy HH:mm:ss.SSS"
clock: "UTC"
fields:
  bid: "Bid"
  ask: "Ask"
  bidVolume: "BidVolume?"
  askVolume: "AskVolume?"
  volume: "BidVolume + AskVolume?"
volume: "bid plus ask quoted size, summed exactly as qkt's Dukascopy fetcher does"
match:
  header: ["Gmt time", "Ask", "Bid"]
