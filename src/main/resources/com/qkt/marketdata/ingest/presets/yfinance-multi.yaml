id: "yfinance-multi"
description: "yfinance >= 0.2.51 CSV with a three-line header (Price/Ticker/Date), one ticker or several: Close is adjusted unless the file also has Adj Close (auto_adjust=False)"
kind: "bars"
time: ["Price"]
timeFormat: "iso"
basis: "last"
fields:
  open: "Open"
  high: "High"
  low: "Low"
  close: "Close"
  volume: "Volume"
float32: true
volume: "shares (contracts for futures)"
match:
  header: ["Price", "Close", "High", "Low", "Open", "Volume"]
