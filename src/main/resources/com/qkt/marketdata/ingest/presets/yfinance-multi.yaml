id: "yfinance-multi"
description: "yfinance >= 0.2.51 CSV with a three-line header (Price/Ticker/Date); its Close is already adjusted"
kind: "bars"
time: ["Price"]
timeFormat: "iso"
basis: "last"
fields:
  open: "Open"
  high: "High"
  low: "Low"
  close: "Close"
  volume: "Volume"
volume: "shares (contracts for futures)"
match:
  header: ["Price", "Close", "High", "Low", "Open", "Volume"]
