id: "kraken-ohlcvt"
description: "Kraken downloadable OHLCVT (no header): epoch seconds, open, high, low, close, volume, trades; empty intervals absent"
kind: "bars"
delimiter: ","
time: ["$0"]
timeFormat: "epoch:s"
basis: "last"
fields:
  open: "$1"
  high: "$2"
  low: "$3"
  close: "$4"
  volume: "$5"
volume: "base-asset volume"
match:
  columns: 7
  firstCell: "\\d{10}"
  delimiter: ","
