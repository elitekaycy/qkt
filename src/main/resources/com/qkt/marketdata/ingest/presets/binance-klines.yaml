id: "binance-klines"
description: "Binance public-data klines without a header (data.binance.vision spot, older futures): epoch ms, spot in µs from 2025"
kind: "bars"
delimiter: ","
time: ["$0"]
timeFormat: "epoch"
basis: "last"
fields:
  open: "$1"
  high: "$2"
  low: "$3"
  close: "$4"
  volume: "$5"
volume: "base-asset volume (contracts on COIN-M)"
match:
  columns: 12
  firstCell: "\\d{13}|\\d{16}"
  delimiter: ","
