# Starter config for the qkt bot CLI (one-shot manual/AI trading).
# Copy next to where you run `qkt bot ...` (or pass --config).

brokers:
  mt5:
    type: mt5
    gateway_url: ${QKT_BROKER_GATEWAY_URL:-http://127.0.0.1:8000}
    api_key: ${QKT_BROKER_API_KEY}
    server_time_zone: ${QKT_BROKER_SERVER_TIME_ZONE}
    symbol_suffix: ${QKT_BROKER_SYMBOL_SUFFIX:-}
    magic: ${QKT_BROKER_MAGIC:-777001}

  # A VGP venue gateway (paper, Deribit, Bybit): perpetuals, dated futures and options.
  # deribit:
  #   type: gateway
  #   gateway_url: ${QKT_VENUE_GATEWAY_URL:-http://127.0.0.1:18444}
  #   api_key: ${QKT_VENUE_GATEWAY_KEY}
  #   expected_adapter: deribit
  #   expected_account_login: ${QKT_VENUE_ACCOUNT}
  #   expected_trade_mode: demo

account:
  currency: USD

# Pre-trade controls: every one-shot order and every session order is checked against these.
# risk:
#   max_order_qty: "5"
#   max_order_notional: "250000"
#   price_collar_pct: "5"

# Optional: egress every bot command/order to qkt-insights.
# insights:
#   enabled: true
#   url: "https://insights.example.com/ingest"
#   token: "${QKT_INSIGHTS_TOKEN}"
#   instance_id: "bot-laptop"
#   events: [order, trade, lifecycle]
