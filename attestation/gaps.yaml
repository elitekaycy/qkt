gaps:
- capability: NORM_CDF
  reason: a pure function of its argument, proven by unit tests and the oracle evidence; an event field reads the
    bar's close and never the session clock, live or not (EventStreamFieldsTest), and a live slot follows the contract
    a backtest would (LiveSlotMarketSourceTest). Its live case is kalshi/kalshi-event-shadow, planned until a gateway
    lane can compare a slot's logged values with a replay (it judges fills, not values), which adds only the venue's
    transport to what those tests prove
- capability: OBV
  reason: needs traded size; the demo FX/CFD feed quotes without volume, so this is provable only on a venue that reports
    it (crypto spot/perpetual)
