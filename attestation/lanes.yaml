# Lanes group attestation cases by what they contend for, which decides what may run at once.
# `concurrency: shared` cases load into one daemon; `per-magic` cases each get a magic number and
# run side by side on one account; `exclusive` cases own the daemon or gateway and run alone.
lanes:
  shadow:
    purpose: Values computed live equal values computed in replay - indicators, math, DSL expressions, across symbols, timeframes and warmup depths. Places no orders.
    concurrency: shared
    places_orders: false
    budget_seconds: 360
  orders:
    purpose: Every order shape reaches the venue and replays to the same journal - market, limit, stop, bracket, trailing, stack, OTO, GTD, partial close, risk-sized entry.
    concurrency: per-magic
    places_orders: true
    budget_seconds: 360
  stocks:
    purpose: Stock CFDs on the MT5 demo (Exness US shares, 100-share lots) - orders and fills inside the 09:40-15:45 New York session Exness takes positions in (it quotes from 06:00, close-only until 09:40), share-sized entries, refusals of close-only symbols, DAY orders expiring at the session close, each replayed to the same fills. Runs only while the US session is open.
    concurrency: per-magic
    places_orders: true
    session: nyse[09:40-15:45]
    budget_seconds: 300
  risk:
    purpose: Caps, rejections and halts bind live exactly as in replay, from restored state, never from hoping the market produces a loss.
    concurrency: per-magic
    places_orders: true
    budget_seconds: 300
  book:
    purpose: Portfolios - allocation, book caps, sibling interaction on one tick, attribution.
    concurrency: per-magic
    places_orders: true
    budget_seconds: 360
  engine:
    purpose: What the engine does when the world misbehaves - restart over open positions, stale feed, gateway restart, unknown order outcome, clock skew, journal and state integrity, cleanup.
    concurrency: exclusive
    places_orders: true
    budget_seconds: 420
  daemon:
    purpose: Every operator command works against a live daemon and leaves the state it claims - deploy, stop, start, resume, halt, flatten, status, logs, positions, reload.
    concurrency: exclusive
    places_orders: true
    budget_seconds: 300
  stress:
    purpose: Load - order bursts, many strategies in one daemon, tick floods, long queues - without dropped ticks, a blocked subscriber or a missed cap.
    concurrency: exclusive
    places_orders: true
    budget_seconds: 420
  derivatives:
    purpose: Futures, perpetuals and options on a VGP gateway account (Deribit testnet) - orders reach the venue on its tick grid, qkt's realized equals the venue's deals net with fees, and replaying the venue's own bars or the account's recorded chain reproduces the decisions. One netting account, so cases run one after another.
    concurrency: exclusive
    places_orders: true
    venue_gateway: true
    budget_seconds: 420
  bybit:
    purpose: Bybit linear perpetuals on a VGP gateway account running the qkt-venue-gateway's Bybit adapter (Bybit testnet), with no Bybit code in qkt - the derivatives lane's proofs (venue tick grid, realized equals the venue's deals net with fees, bars replay makes the same fills, restart, outage and kill-switch drills) on a second venue. Its own netting account, so cases run one after another, beside the derivatives lane.
    concurrency: exclusive
    places_orders: true
    venue_gateway: true
    budget_seconds: 420
  alpaca:
    purpose: US shares on a VGP gateway account running the qkt-venue-gateway's Alpaca adapter (Alpaca paper), with no Alpaca code in qkt - the gateway lanes' proofs (realized equals the venue's deals net and the account's cash, bars replay makes the same fills, restart, flat restart, outage and kill-switch drills) on cash equities. Market orders trade the regular session, so it runs only inside 09:30-16:00 New York. Its own account, so cases run one after another.
    concurrency: exclusive
    places_orders: true
    venue_gateway: true
    session: nyse
    budget_seconds: 420
