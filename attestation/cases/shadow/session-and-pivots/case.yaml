id: session-and-pivots
title: Session ranges, pivots, seasonal ranges, gaps and the clock accessors
why: These indicators depend on where the session and the day begin, which comes from the broker's
  server time zone and a deep one-minute history. A wrong offset or a warmup that stops short of
  the previous session shifts every level by a session while each value still looks plausible.
