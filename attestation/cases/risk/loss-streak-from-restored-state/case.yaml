id: loss-streak-from-restored-state
title: A loss-streak halt binds on a streak restored from disk
why: The halt must hold on the first entry after a restart that carries the losing streak, with nothing
  sent to the venue. Waiting for the market to supply two losing trades made the old version of this
  case fail on a winning trade; here the streak is restored from the risk-state file, as it is after
  any real restart.
status: ready
symbols:
- BTCUSD
timeframes:
- 1m
proves:
- behaviour:loss-streak-halt
- behaviour:risk-state-restore
seed_risk_state:
  pacerLossStreakByStrategy: 2
  pacerLastLossAtByStrategy: now
steps:
- run: qkt status atto_streak --state-dir {state}
  wait_log: 'LossStreakHalt\[atto_streak\]'
  wait_seconds: 150
  expect_status:
    halted: true
    positions: 0
  expect_positions: 0
  expect_pending: 0
  note: the first entry attempt meets the restored streak - halted, and nothing reached the venue
- run: qkt list --state-dir {state}
  expect_stdout: 'atto_streak.*halted'
  note: the operator sees it in the list
- run: qkt status --deep --state-dir {state}
  expect_stdout: 'HEALTHY \(1 halted by risk control\)(?s:.*)is halted .*qkt resume atto_streak'
  note: the deep status names the halt and the command that clears it - and stays exit 0, because
    container health runs this command and a risk halt is not a fault
- daemon: restart
  note: a daily halt survives a restart inside the same day
- run: qkt status atto_streak --state-dir {state}
  expect_status:
    halted: true
  expect_positions: 0
  note: still halted after the restart
assertions:
- zero-mutating-requests
- halt-survives-restart
autoload: true
budget_seconds: 420
config:
  risk:
    per_strategy:
      atto_streak:
        loss_streak_halt: 2
        loss_streak_halt_scope: daily
