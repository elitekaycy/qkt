id: same-symbol-two-venues
title: One strategy trades the same BTC perpetual on two gateway venues beside a BTC CFD on the MT5 demo
why: 'Two venues quoting one bare symbol (matrix K01) used to share one tick store: the golden capture refused them,
  and a replay read one venue''s prices for both. Each venue now keeps its own ticks (ticks/<LABEL>/<SYMBOL>), so
  only a case trading the same name on two venues shows a leg replayed on the other venue''s prices.'
