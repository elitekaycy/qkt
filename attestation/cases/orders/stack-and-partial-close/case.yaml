id: stack-and-partial-close
title: A stack whose second layer rests far away and is cleaned up
why: A stack places a seed at market and further layers as pending orders anchored to the seed fill. Closing the
  position must also remove the layers still resting at the venue; a layer left behind fills days later into a strategy
  that believes it is flat.
status: ready
symbols:
- BTCUSD
timeframes:
- 1m
proves:
- behaviour:stack
- behaviour:pending-layer-cleanup
assertions:
- flat-by-magic
- no-pending-by-magic
- deals-net-by-magic
- no-engine-fault
- replay-fill-sequence
warmup_bars:
  1m: 3
budget_seconds: 200
