id: bybit-perpetual-drill-kill-switch
title: A perpetual bracket held while the guardian engages and releases the gateway kill switch
why: 'The kill switch lives in the gateway, outside qkt: while it is on, an order that adds risk must be
  refused, the held position and its bracket legs must survive, and once released the strategy must
  still close and book exactly what the venue did. A switch that lets risk through, or a daemon that
  loses its legs or misbooks the close around it, shows here.'
status: ready
symbols:
- BYBIT_LINEAR:BTCUSDT
timeframes:
- 1m
warmup_bars:
  1m: 3
proves:
- behaviour:market-entry
- behaviour:bracket
- behaviour:timed-exit
- behaviour:kill-switch
fills: 2
replay: bars
drills:
- at_s: 60
  kind: kill_switch
  hold_s: 30
assertions:
- flat-account
- deals-net-equals-realized
- replay-same-fills
- venue-fills-equal-qkt-fills
- no-duplicate-order
- order-id-continuity
- kill-switch-refuses-risk
budget_seconds: 600
