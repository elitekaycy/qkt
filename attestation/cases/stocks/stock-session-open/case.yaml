id: stock-session-open
title: A stock strategy started before the open trades first on the session's first bar
why: 'On the FX calendar a stock was "in session" all night: a restart at 05:00 New York evaluated stale
  overnight bars and the staleness alarm fired for a market that was simply shut. Started a few minutes
  before 06:00 New York, the case must stay quiet, then buy within the session''s first minutes.'
status: scheduled
symbols:
- AAPL
timeframes:
- 1m
warmup_bars:
  1m: 0
proves:
- behaviour:stock-cfd
- behaviour:session-open
budget_seconds: 600
expect_first_fill_within:
  after: "06:00 America/New_York"
  seconds: 240
expect_fills:
- BUY 0.01
- SELL 0.01
assertions:
- flat-by-magic
- no-pending-by-magic
- deals-net-by-magic
- no-engine-fault
- replay-fill-sequence
- expected-fills
- first-fill-after-open
