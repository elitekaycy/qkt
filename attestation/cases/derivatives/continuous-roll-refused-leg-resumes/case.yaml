id: continuous-roll-refused-leg-resumes
title: The venue refuses a roll's opening leg, the strategy stops flat, and resume lets it trade again
why: 'A collared opening leg the venue does not fill leaves the position gone from the old contract: it must close on
  the stream at the closing leg''s fill, stop the strategy, and book exactly what the venue did (#1589). Nothing is then
  left of the strategy, so `qkt resume` must clear the stop and its next order reach the venue, where it once stayed
  refused for ever (#1561). The gateway''s kill switch on the new contract alone gives the real refusal; a far book cannot
  be scheduled. It proves a refused leg, 423 from the gateway, not an IOC the book left unfilled.'
status: planned
