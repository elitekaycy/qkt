id: option-held-through-expiry
title: An in-the-money option held through its expiry is settled once, at the venue's price
why: 'An expiry is no order: the venue closes the held option at its intrinsic value from the delivery price
  and reports it only as a settlement. If qkt misses it the strategy holds a contract that no longer exists;
  if a stream event and a resync both deliver it, it is booked twice; if it is booked at the mark or the last
  trade, realized PnL and the account disagree.'
