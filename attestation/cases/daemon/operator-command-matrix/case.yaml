id: operator-command-matrix
title: Every operator command against a live daemon
why: Commands are exercised one at a time by hand and rot silently. Each must exit with the documented code and
  leave the state it reports - including the ones used only in an emergency.
status: ready
symbols:
- BTCUSD
timeframes:
- 1m
proves:
- behaviour:cli:daemon_status
- behaviour:cli:deploy
- behaviour:cli:list
- behaviour:cli:status
- behaviour:cli:status_deep
- behaviour:cli:logs
- behaviour:cli:halt
- behaviour:cli:resume
- behaviour:cli:reconcile
- behaviour:cli:stop_flatten
- behaviour:cli:unknown_name_exit_code
steps:
- run: qkt daemon status --state-dir {state}
  note: the control plane answers before anything is deployed
- run: qkt deploy {file} --state-dir {state}
  expect_stdout: (?i)deploy|atto_ops
  note: deploy at runtime, not via --load-dir
- run: qkt list --state-dir {state}
  expect_stdout: atto_ops
  note: the deployed strategy is listed
- run: qkt status {strategy} --state-dir {state}
  wait_for: position
  expect_status:
    positions: 1
  note: status reports the position the venue holds
- run: qkt status --deep --state-dir {state}
  note: aggregate health is green while trading
- run: qkt logs {strategy} --lines 5 --state-dir {state}
  expect_stdout: \S
  note: per-strategy log stream is not empty
- run: qkt halt {strategy} --state-dir {state}
  expect_stdout: (?i)halt
  note: operator halt
- run: qkt status {strategy} --state-dir {state}
  expect_status:
    positions: 1
  note: a halt stops new entries; it must not close the open position
- run: qkt resume {strategy} --state-dir {state}
  expect_stdout: (?i)resum
  note: only resume clears an operator halt
- run: qkt reconcile {strategy} --state-dir {state}
  note: reconcile against the venue while a position is open
- run: qkt stop {strategy} --flatten --state-dir {state}
  note: stop --flatten closes the position at the venue
- run: qkt list --state-dir {state}
  wait_for: flat
  note: after the flatten the venue holds nothing under this magic
- run: qkt status nonexistent_strategy --state-dir {state}
  expect_exit: 1
  note: an unknown name is a user error, not a crash or a zero exit
assertions:
- exit-codes
- state-matches-report
budget_seconds: 300
