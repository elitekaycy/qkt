id: wrong-account-refused
title: The gateway is logged into a different account than the config expects
why: The identity check is the last thing between a config and the wrong account's money. It must refuse to start,
  and a misspelled identity key must refuse too.
status: ready
symbols:
- EURUSD
timeframes:
- 1m
proves:
- behaviour:account-identity
assertions:
- daemon-refuses
- zero-mutating-requests
autoload: true
budget_seconds: 120
config:
  brokers:
    exness:
      expected_account_login: 999999999
expect_startup_refusal: 'account login mismatch: expected 999999999'
steps:
- run: qkt list --state-dir {state}
  note: 'never reached: the daemon must refuse to start'
