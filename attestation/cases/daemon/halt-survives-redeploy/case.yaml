id: halt-survives-redeploy
title: A persistent halt is still a halt after redeploy, and only resume clears it
why: '`qkt start` does not clear a persistent halt; an operator who believes it does leaves a book silently not
  trading.'
status: ready
symbols:
- BTCUSD
timeframes:
- 1m
proves:
- behaviour:persistent-halt
- behaviour:halt-survives-resync
- behaviour:resume
steps:
- run: qkt deploy {file} --state-dir {state}
  note: deployed mid-bar, before its first evaluation
- run: qkt halt {strategy} --state-dir {state}
  note: operator halt before the strategy has traded
- run: qkt list --state-dir {state}
  settle_seconds: 75
  expect_positions: 0
  expect_log: halt \(operator
  note: 'a full bar later the eager strategy still holds nothing: the halt binds'
- run: qkt status {strategy} --state-dir {state}
  expect_status:
    halted: true
    haltReason: operator
  note: 'status says so: a halted strategy must not look like a quiet healthy one (#1210)'
- run: qkt resync {file} --state-dir {state}
  note: redeploy the same strategy under the same name
- run: qkt list --state-dir {state}
  settle_seconds: 75
  expect_positions: 0
  note: 'still nothing a bar after the redeploy: a persistent halt survives it'
- run: qkt status {strategy} --state-dir {state}
  expect_status:
    halted: true
    haltReason: operator
  note: 'status says so: a halted strategy must not look like a quiet healthy one (#1210)'
- run: qkt resume {strategy} --state-dir {state}
  note: only resume clears it
- run: qkt status {strategy} --state-dir {state}
  wait_for: position
  wait_seconds: 100
  expect_status:
    positions: 1
    halted: false
  note: and the strategy trades again
- run: qkt stop {strategy} --flatten --state-dir {state}
  note: clean exit
assertions:
- status-says-halted
- no-entry-while-halted
budget_seconds: 330
