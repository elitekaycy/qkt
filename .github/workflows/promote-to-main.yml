name: promote-to-main

# Manual promotion: testing -> main. A maintainer triggers this from the
# Actions tab (or `gh workflow run promote-to-main.yml`) after inspecting
# testing. It verifies integration and exact-image paper-soak evidence for the
# current testing SHA, then creates or reuses a promotion PR. Merging remains
# subject to review and branch protection.

on:
  workflow_dispatch:

permissions:
  contents: read
  actions: write
  pull-requests: write

jobs:
  promote:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: testing
      - name: Prepare testing promotion PR
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: bash scripts/prepare-main-promotion.sh
