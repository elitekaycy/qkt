name: docker

on:
  push:
    branches: [main, testing]
    tags: ['v*']

jobs:
  runtime-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build runtime image
        uses: docker/build-push-action@v5
        with:
          context: .
          target: runtime
          platforms: linux/amd64
          load: true
          tags: qkt:ci
          build-args: |
            QKT_GIT_SHA=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Smoke runtime image
        run: |
          set -euo pipefail
          tmp="$(mktemp -d)"
          trap 'rm -rf "$tmp"' EXIT
          mkdir -p "$tmp/strategies"
          cat > "$tmp/strategies/smoke.qkt" <<'STRAT'
          STRATEGY smoke VERSION 1

          SYMBOLS
              btc = BACKTEST:BTCUSD EVERY 1m

          RULES
              WHEN btc.close > 0
              THEN LOG "tick"
          STRAT
          version="$(docker run --rm --entrypoint qkt qkt:ci --version)"
          printf '%s\n' "$version"
          grep -Fq "(${GITHUB_SHA})" <<<"$version"
          docker run --rm --entrypoint qkt -v "$tmp/strategies:/strategies:ro" qkt:ci parse /strategies/smoke.qkt
          docker run --rm --entrypoint qkt \
            -v "$PWD/data/sample:/data:ro" \
            -v "$tmp/strategies:/strategies:ro" \
            qkt:ci backtest /strategies/smoke.qkt \
              --from 2024-01-15 \
              --to 2024-01-16 \
              --data-root /data \
              --allow-incomplete \
              --json >/tmp/qkt-docker-smoke.json

  build-and-push:
    needs: runtime-smoke
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      attestations: write
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        # The testing build has a fixed :edge tag and fixed OCI labels below, so it does not need
        # repository metadata. Keeping it off this path prevents a transient GitHub metadata API
        # outage from blocking publication after runtime-smoke has already passed.
        if: github.ref != 'refs/heads/testing'
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/qkt
          tags: |
            type=ref,event=tag
            type=sha,prefix=sha-
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}
      # Runtime image: `:latest` on a main push, `:vX.Y.Z` on a version tag.
      - name: build and push runtime image
        if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/')
        uses: docker/build-push-action@v5
        with:
          context: .
          target: runtime
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            QKT_GIT_SHA=${{ github.sha }}
          provenance: mode=max
          sbom: true
          cache-from: type=gha
          cache-to: type=gha,mode=max
      # Developer image (`:dev`) — runtime + editor + shell, for authoring and
      # testing strategies inside a container. Mutable tag, rebuilt on every main
      # push (like `:latest`); not published on version tags.
      - name: build and push dev image
        if: github.ref == 'refs/heads/main'
        uses: docker/build-push-action@v5
        with:
          context: .
          target: dev
          platforms: linux/amd64
          push: true
          tags: ghcr.io/${{ github.repository_owner }}/qkt:dev
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            QKT_GIT_SHA=${{ github.sha }}
          provenance: mode=max
          sbom: true
          cache-from: type=gha
          cache-to: type=gha,mode=max
      # Edge image (`:edge`) — the runtime built from the `testing` branch, which is
      # auto-fast-forwarded from `dev` and has passed the integration CI. Lets downstream
      # automation consume integration-tested capabilities without waiting for the manual
      # promotion to `main`. Mutable tag, rebuilt on every testing push; not on tags or main.
      - name: build and push edge image
        if: github.ref == 'refs/heads/testing'
        uses: docker/build-push-action@v5
        with:
          context: .
          target: runtime
          platforms: linux/amd64
          push: true
          tags: ghcr.io/${{ github.repository_owner }}/qkt:edge
          labels: |
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
          build-args: |
            QKT_GIT_SHA=${{ github.sha }}
          provenance: mode=max
          sbom: true
          cache-from: type=gha
          cache-to: type=gha,mode=max
