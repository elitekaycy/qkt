name: docs

# Builds the MkDocs Material site + Dokka API reference and deploys to GitHub Pages.
# All template expressions reference internal step outputs only — no user-controlled
# inputs (issue title, commit message, PR body, etc.) are interpolated into shell
# commands. See https://github.blog/security/vulnerability-research/how-to-catch-github-actions-workflow-injections-before-attackers-do/

on:
  push:
    branches: [main]
    paths:
      - 'docs/**'
      - 'mkdocs.yml'
      - 'requirements-docs.txt'
      - 'src/main/**'
      - 'build.gradle.kts'
      - 'gradle/libs.versions.toml'
      - '.github/workflows/docs.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: docs-deploy
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build Dokka API reference
        run: ./gradlew dokkaHtml --no-daemon

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements-docs.txt

      - name: Install MkDocs + plugins
        run: pip install -r requirements-docs.txt

      - name: Build MkDocs site
        run: mkdocs build --strict

      - name: Embed Dokka under /api
        run: |
          mkdir -p site/api
          cp -r build/dokka/html/. site/api/

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

  # Fails the run when GitHub Pages is not serving the site, so a Pages setting that drifts (source branch,
  # custom domain) is noticed on the next deploy instead of by a visitor. It asks the Pages origin directly:
  # docs.tryqkt.com is behind Cloudflare, which answers GitHub's runners with 403, while Pages itself answers
  # 200 for its custom domain and 404 for a host it is not set up for.
  verify:
    needs: deploy
    runs-on: ubuntu-latest
    steps:
      - name: Check GitHub Pages serves the site
        run: |
          host=docs.tryqkt.com
          for _ in $(seq 1 8); do
            code=$(curl -s -o /dev/null -w "%{http_code}" --resolve "$host:80:185.199.108.153" "http://$host/" || true)
            [ "$code" = 200 ] && exit 0
            sleep 15
          done
          echo "::error::GitHub Pages answered ${code:-nothing} for $host after the deploy: check Settings > Pages (source GitHub Actions, custom domain)"
          exit 1
