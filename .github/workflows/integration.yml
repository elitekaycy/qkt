name: integration

# Black-box integration suite — mimics a user installing and exercising qkt:
# clean install, qkt --version, author + parse + backtest a strategy, daemon
# lifecycle, Docker build + in-container run. Runs on the promotion targets
# (testing and main). Feature-branch PRs and dev get only the fast essentials
# (check.yml); this heavier suite gates the staging branches.
#
# All template expressions reference internal context only (github.ref) — no
# untrusted event input is interpolated into shell commands.

on:
  push:
    branches: [testing, main]

concurrency:
  group: integration-${{ github.ref }}
  cancel-in-progress: true

jobs:
  integration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
      - name: Integration smoke
        run: bash tests/smoke-install.sh
      # The README quick start as a newcomer runs it: the self-contained bundle on a clean ubuntu with no Java (#1471).
      - name: README quick start on a clean machine
        run: |
          ./gradlew --no-daemon selfContainedDist
          bash tests/quickstart-readme.sh build/distributions/qkt-*-linux-x64.tar.gz
      # Every real-data case, the large vendor files included (the pull-request tier runs the small ones).
      - name: Read the pinned data corpus commit
        id: corpus
        run: echo "sha=$(cut -d' ' -f1 tests/data-e2e/corpus.lock)" >> "$GITHUB_OUTPUT"
      - name: Check out the data corpus
        uses: actions/checkout@v4
        with:
          repository: elitekaycy/qkt-data-corpus
          ref: ${{ steps.corpus.outputs.sha }}
          ssh-key: ${{ secrets.QKT_DATA_CORPUS_KEY }}
          path: qkt-data-corpus
      - name: Real-data end-to-end suite (full)
        run: |
          ./gradlew installDist --no-daemon
          python3 -I qkt-data-corpus/tools/provenance.py --check
          python3 -I tests/data-e2e/run.py --tier full --corpus qkt-data-corpus --report build/data-e2e.json
      # qkt against backtesting.py and backtrader, to the cent: the references live in the corpus.
      - name: External references
        run: python3 -I tests/references/run.py --refs qkt-data-corpus/references --report build/references.json
      - name: Upload the data suite report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: data-e2e
          path: |
            build/data-e2e.json
            build/references.json
          retention-days: 7
          if-no-files-found: ignore
      - name: Upload smoke log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: smoke-log
          path: /tmp/qkt-smoke.*/smoke.log
          retention-days: 7
          if-no-files-found: ignore
